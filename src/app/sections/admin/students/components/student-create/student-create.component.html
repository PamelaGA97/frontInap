<div class="container">
    <div class="base-crud card">
        <div class="base-crud__header">
            <h3>Crear estudiante</h3>
        </div>
        <div class="base-crud__content">
            <app-student-form #studentForm (submitFormEvent)="saveStudent($event)"></app-student-form>
        </div>
        <div class="base-crud__footer">
            <button class="btn-triage medium btn__solid-primary mr-2 options" (click)="createStudent()">Crear</button>
            <button class="btn-triage medium btn__solid-tertiary option" (click)="backToStudentList()">Cancelar</button>
        </div>
    </div>
</div>
