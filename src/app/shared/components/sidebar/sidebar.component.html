<ul class="sidebar">
	@for (viewPage of viewPages; track $index) {
		<li class="nav-item">
			<a
				[routerLink]="viewPage.path"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ exact: true }"
			>
				<div class="item">
					<span>{{viewPage.name}}</span>
				</div>
			</a>
		</li>
	}
</ul>
